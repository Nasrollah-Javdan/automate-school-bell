appId: com.ds.schoolbell
productName: DS School Bell
copyright: Copyright © 2026 DS School Bell

directories:
  output: release
  buildResources: resources

# Pinned toolset versions. The modern bundles let us build Windows artifacts on
# Linux and macOS without a system-wide Wine/NSIS install:
#   wine        - portable Wine 11, runs rcedit/signtool on non-Windows hosts
#   nsis        - unified makensis 3.12 bundle (plugins included)
#   winCodeSign - modern rcedit + signtool bundle (Beta per upstream release notes)
toolsets:
  wine: '1.0.1'
  nsis: '1.2.1'
  winCodeSign: '1.1.0'

files:
  - out/**/*
  - package.json
  - '!**/*.map'
  - '!**/{.eslintrc,.editorconfig,.prettierrc}'

# The tray icon and the window icon are loaded from disk at runtime, so they
# have to sit next to the executable instead of inside the asar. Without this
# both `nativeImage.createFromPath` calls return an empty image and the tray
# icon is invisible in the packaged app.
extraResources:
  # The bundled bell tone is copied into the user's sounds folder on first run.
  # Its name must stay in sync with DEFAULT_SOUND_FILE in src/shared/defaults.ts.
  - from: resources/school-bell.mp3
    to: school-bell.mp3
  - from: resources/tray.png
    to: tray.png
  - from: resources/tray@2x.png
    to: tray@2x.png
  - from: resources/icon.png
    to: icon.png

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.ico
  artifactName: ${productName}-Setup.${ext}
  # No installer bloat: ship the app only.
  legalTrademarks: DS School Bell

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DS School Bell
  menuCategory: false
  runAfterFinish: true
  # Uninstaller and registry cleanup.
  deleteAppDataOnUninstall: false
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  installerHeaderIcon: resources/icon.ico
  include: build/installer.nsh

portable:
  artifactName: ${productName}-Portable.${ext}

linux:
  target:
    - AppImage
  icon: resources/icon.png
  category: Utility
  synopsis: School bell scheduling
  desktop:
    entry:
      Name: DS School Bell
      Comment: School bell scheduling
      Categories: Utility;AudioVideo;Audio;
  # Lets the desktop environment link the running window to its entry.
  syncDesktopName: true
  mimeTypes:
    - audio/mpeg
    - audio/wav
    - audio/ogg

# Builds are intentionally unsigned: a school can install without a code
# signing certificate. Windows SmartScreen will ask once on first install.
# To sign your own builds, set CSC_LINK / CSC_KEY_PASSWORD in the environment.